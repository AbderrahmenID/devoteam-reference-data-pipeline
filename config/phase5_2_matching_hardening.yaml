retrieval:
  supported_modes: [bm25, dense, hybrid]
  default_mode: hybrid
  query_maximum_characters: 4000
  candidate_chunks_per_requirement: 100
  evidence_chunks_per_reference_requirement: 3
  fusion:
    method: reciprocal_rank_fusion
    rrf_k: 60
    lexical_weight: 0.75
    dense_weight: 0.25
    candidate_pool_per_retriever: 100
  reranking:
    strategy: deterministic_evidence_v1
    retrieval_weight: 0.80
    term_coverage_weight: 0.20
    cross_encoder_enabled: false
    cross_encoder_requires_expert_evaluation: true
  fusion_sweep:
    - {name: hybrid_90_10, lexical_weight: 0.90, dense_weight: 0.10}
    - {name: hybrid_80_20, lexical_weight: 0.80, dense_weight: 0.20}
    - {name: hybrid_75_25, lexical_weight: 0.75, dense_weight: 0.25}
    - {name: hybrid_70_30, lexical_weight: 0.70, dense_weight: 0.30}
    - {name: hybrid_60_40, lexical_weight: 0.60, dense_weight: 0.40}
    - {name: hybrid_50_50, lexical_weight: 0.50, dense_weight: 0.50}

eligibility:
