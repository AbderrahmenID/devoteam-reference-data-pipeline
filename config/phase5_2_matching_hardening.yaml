  allowed_data_quality_statuses: [PASS, PARTIAL_PAGE_EXCLUSION]
  must_requirement_gate: true
  diagnostic_ineligible_candidates_allowed: true
  maximum_one_per_duplicate_group: true
  evidence_policy_patterns:
